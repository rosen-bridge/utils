[package]
name = "rosen-zcash-native-finalizer"
version = "0.1.0"
edition = "2024"

[dependencies]
hex = "=0.4.3"
orchard = { version = "=0.15.5", default-features = false, features = ["std", "circuit"] }
ripemd = "=0.1.3"
sapling = { package = "sapling-crypto", version = "=0.7.0", default-features = false, features = ["std", "circuit"] }
secp256k1 = { version = "=0.29.1", default-features = false, features = ["alloc"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
zcash_primitives = { version = "=0.30.1", default-features = false, features = ["std", "transparent-inputs"] }
zcash_protocol = { version = "=0.10.5", default-features = false, features = ["local-consensus"] }
zcash_script = { version = "=0.4.3", default-features = false, features = ["std", "signature-validation"] }
zcash_transparent = { version = "=0.10.0", default-features = false, features = ["std", "transparent-inputs"] }
zcash_address = "=0.13.0"
zcash_note_encryption = "=0.4.2"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
pczt = { path = "vendor/pczt", features = ["std", "transparent", "orchard", "sapling", "signer", "zcp-builder", "prover", "io-finalizer", "spend-finalizer", "tx-extractor"] }
