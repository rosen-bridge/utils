[package]
name = "rosen-zcash-native-inspector"
version = "0.1.0"
edition = "2024"

[dependencies]
hex = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
zcash_primitives = { version = "=0.30.1", default-features = false, features = ["std"] }
zcash_protocol = { version = "=0.10.5", default-features = false }
zcash_script = { version = "=0.4.3", default-features = false, features = ["std"] }
zcash_transparent = { version = "=0.10.0", default-features = false, features = ["std"] }
